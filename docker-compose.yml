version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: medoryx-postgres
    restart: always
    environment:
      POSTGRES_DB: medoryx
      POSTGRES_USER: medoryxuser
      POSTGRES_PASSWORD: medoryxpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medoryxuser -d medoryx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medoryx-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://medoryxuser:medoryxpassword@db:5432/medoryx
      - DEMO_DETERMINISTIC=true
      - DEMO_DATE=2026-09-30
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medoryx-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
